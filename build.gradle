buildscript {
    ext {
        // It's good practice to use a more recent and compatible Kotlin version
        kotlin_version = '2.0.0' // Or a newer stable version
        // These are not used in your root build.gradle but good to keep track of
        compose_version = '1.6.0'
        compose_compiler_version = '1.5.8'
    }

}

plugins {
    // Use a valid and recent AGP version. AGP 8.x requires JDK 17.
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version "$kotlin_version" apply false
    id 'org.jetbrains.kotlin.plugin.compose' version "$kotlin_version" apply false
    // 'kapt' is often applied in module-level build.gradle files, but this is okay.
    id 'org.jetbrains.kotlin.kapt' version "$kotlin_version" apply false
    // Update Hilt to a more recent version for better compatibility
    id 'com.google.dagger.hilt.android' version '2.57.2' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
